<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ester Reaction Timeline</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, "Noto Sans Thai", sans-serif;
    background: #f5f7fb;
    color: #222;
}

header {
    background: #ffffff;
    padding: 25px 20px;
    text-align: center;
    border-bottom: 1px solid #ddd;
}

header h1 {
    margin: 0;
    font-size: 30px;
}

header p {
    margin: 8px 0 0;
    color: #666;
}

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 0 20px;
}

.mode-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 25px;
}

.mode-btn {
    padding: 12px 20px;
    border: 1px solid #ccc;
    background: white;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.mode-btn.active {
    background: #222;
    color: white;
}

.game-box {
    background: white;
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

.question {
    text-align: center;
    margin-bottom: 25px;
}

.question h2 {
    margin: 0 0 8px;
}

.question p {
    color: #666;
    margin: 0;
}

.timeline {
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-height: 300px;
}

.card {
    background: #ffffff;
    border: 2px solid #ddd;
    border-radius: 12px;
    padding: 18px;
    cursor: grab;
    user-select: none;
    transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
}

.card:hover {
    border-color: #888;
    transform: translateY(-2px);
}

.card:active {
    cursor: grabbing;
}

/* สำคัญ: ตอนลากไม่ให้การ์ดหรือข้อความจาง */
.card.dragging {
    opacity: 1 !important;
    transform: scale(1.03);
    box-shadow: 0 8px 20px rgba(0,0,0,0.18);
    border-color: #222;
}

.card-number {
    display: inline-flex;
    width: 30px;
    height: 30px;
    align-items: center;
    justify-content: center;
    background: #222;
    color: white;
    border-radius: 50%;
    margin-right: 10px;
    font-weight: bold;
}

.card-text {
    font-size: 17px;
    font-weight: 500;
}

.card.correct {
    border-color: #2e8b57;
    background: #eefaf2;
}

.card.wrong {
    border-color: #d9534f;
    background: #fff1f1;
}

.buttons {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-top: 25px;
    flex-wrap: wrap;
}

button {
    border: none;
    padding: 13px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 16px;
}

.check-btn {
    background: #222;
    color: white;
}

.new-btn {
    background: #e9e9e9;
    color: #222;
}

button:hover {
    transform: translateY(-1px);
}

.result {
    text-align: center;
    margin-top: 20px;
    min-height: 30px;
    font-size: 18px;
    font-weight: bold;
}

.score {
    display: flex;
    justify-content: center;
    gap: 30px;
    margin-top: 20px;
    color: #555;
}

@media (max-width: 600px) {
    header h1 {
        font-size: 24px;
    }

    .game-box {
        padding: 18px;
    }

    .card {
        padding: 15px;
    }

    .card-text {
        font-size: 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>🧪 Ester Reaction Timeline</h1>
    <p>ลากขั้นตอนของปฏิกิริยาให้เรียงลำดับอย่างถูกต้อง</p>
</header>

<div class="container">

    <div class="mode-buttons">
        <button class="mode-btn active" id="esterificationBtn"
            onclick="changeMode('esterification')">
            Esterification
        </button>

        <button class="mode-btn" id="hydrolysisBtn"
            onclick="changeMode('hydrolysis')">
            Hydrolysis
        </button>
    </div>

    <div class="game-box">

        <div class="question">
            <h2 id="questionTitle">Esterification</h2>
            <p>ลากการ์ดเพื่อจัดลำดับขั้นตอนให้ถูกต้อง</p>
        </div>

        <div class="timeline" id="timeline"></div>

        <div class="buttons">
            <button class="check-btn" onclick="checkAnswer()">
                ✓ ตรวจคำตอบ
            </button>

            <button class="new-btn" onclick="newQuestion()">
                ↻ ข้อใหม่
            </button>
        </div>

        <div class="result" id="result"></div>

        <div class="score">
            <div>คะแนน: <b id="score">0</b></div>
            <div>ถูก: <b id="correct">0</b></div>
            <div>ข้อ: <b id="questionNumber">1</b></div>
        </div>

    </div>
</div>

<script>

const questions = {

    esterification: [
        {
            title: "Esterification",
            steps: [
                "กรดคาร์บอกซิลิกทำปฏิกิริยากับแอลกอฮอล์",
                "เติมกรดเข้มข้น เช่น H₂SO₄ เพื่อเป็นตัวเร่งปฏิกิริยา",
                "เกิดการรวมตัวและมีการถ่ายโอนโปรตอน",
                "น้ำถูกกำจัดออกจากระบบ",
                "เกิดเอสเทอร์และน้ำ"
            ]
        },

        {
            title: "Esterification",
            steps: [
                "เริ่มจากกรดคาร์บอกซิลิกและแอลกอฮอล์",
                "โปรตอนจากกรดเข้มข้นช่วยกระตุ้นหมู่คาร์บอนิล",
                "แอลกอฮอล์เข้าทำปฏิกิริยากับคาร์บอนิล",
                "มีการถ่ายโอนโปรตอนและกำจัดน้ำ",
                "ได้ผลิตภัณฑ์เป็นเอสเทอร์"
            ]
        }
    ],

    hydrolysis: [
        {
            title: "Hydrolysis",
            steps: [
                "เริ่มจากเอสเทอร์",
                "เติมน้ำเพื่อทำให้เกิดปฏิกิริยาไฮโดรลิซิส",
                "น้ำเข้าทำปฏิกิริยากับหมู่เอสเทอร์",
                "พันธะเอสเทอร์เกิดการแตกออก",
                "ได้กรดคาร์บอกซิลิกและแอลกอฮอล์"
            ]
        },

        {
            title: "Hydrolysis",
            steps: [
                "นำเอสเทอร์มาทำปฏิกิริยากับน้ำ",
                "กรดช่วยเร่งปฏิกิริยาไฮโดรลิซิส",
                "น้ำเข้าทำปฏิกิริยาบริเวณหมู่คาร์บอนิล",
                "เกิดการถ่ายโอนโปรตอนและการแตกพันธะ",
                "ได้กรดคาร์บอกซิลิกและแอลกอฮอล์"
            ]
        }
    ]
};


let currentMode = "esterification";
let currentQuestion = null;
let score = 0;
let correct = 0;
let questionCount = 1;

const timeline = document.getElementById("timeline");
const result = document.getElementById("result");

function changeMode(mode) {

    currentMode = mode;

    document.getElementById("esterificationBtn")
        .classList.toggle("active", mode === "esterification");

    document.getElementById("hydrolysisBtn")
        .classList.toggle("active", mode === "hydrolysis");

    score = 0;
    correct = 0;
    questionCount = 1;

    document.getElementById("score").textContent = score;
    document.getElementById("correct").textContent = correct;
    document.getElementById("questionNumber").textContent = questionCount;

    newQuestion();
}


function newQuestion() {

    const questionList = questions[currentMode];

    currentQuestion =
        questionList[Math.floor(Math.random() * questionList.length)];

    document.getElementById("questionTitle").textContent =
        currentQuestion.title;

    result.textContent = "";

    timeline.innerHTML = "";

    // สร้างลำดับที่ถูกต้องแล้วสับการ์ด
    let shuffled = [...currentQuestion.steps];

    shuffled.sort(() => Math.random() - 0.5);

    shuffled.forEach((step, index) => {

        const card = document.createElement("div");

        card.className = "card";
        card.draggable = true;

        card.innerHTML = `
            <span class="card-number">${index + 1}</span>
            <span class="card-text">${step}</span>
        `;

        addDragEvents(card);

        timeline.appendChild(card);
    });
}


function addDragEvents(card) {

    card.addEventListener("dragstart", () => {
        card.classList.add("dragging");
    });

    card.addEventListener("dragend", () => {
        card.classList.remove("dragging");
    });

    card.addEventListener("dragover", (e) => {

        e.preventDefault();

        const draggingCard =
            document.querySelector(".dragging");

        if (!draggingCard || draggingCard === card) return;

        const rect = card.getBoundingClientRect();

        const middle = rect.top + rect.height / 2;

        if (e.clientY < middle) {
            timeline.insertBefore(draggingCard, card);
        } else {
            timeline.insertBefore(
                draggingCard,
                card.nextSibling
            );
        }
    });
}


function updateNumbers() {

    const cards =
        document.querySelectorAll(".card");

    cards.forEach((card, index) => {

        card.querySelector(".card-number")
            .textContent = index + 1;

    });
}


function checkAnswer() {

    updateNumbers();

    const cards =
        document.querySelectorAll(".card");

    let playerAnswer = [];

    cards.forEach(card => {

        playerAnswer.push(
            card.querySelector(".card-text").textContent
        );

    });

    let isCorrect = true;

    for (let i = 0; i < currentQuestion.steps.length; i++) {

        if (playerAnswer[i] !== currentQuestion.steps[i]) {
            isCorrect = false;
        }

    }

    cards.forEach((card, index) => {

        card.classList.remove("correct", "wrong");

        if (playerAnswer[index] === currentQuestion.steps[index]) {
            card.classList.add("correct");
        } else {
            card.classList.add("wrong");
        }

    });


    if (isCorrect) {

        score += 10;
        correct++;

        result.textContent = "🎉 ถูกต้อง! เรียงลำดับได้ครบแล้ว";

    } else {

        result.textContent =
            "❌ ยังไม่ถูก ลองดูตำแหน่งที่เป็นสีแดงแล้วจัดใหม่";

    }

    document.getElementById("score").textContent = score;
    document.getElementById("correct").textContent = correct;
}


// เริ่มเกม
newQuestion();

</script>

</body>
</html>
